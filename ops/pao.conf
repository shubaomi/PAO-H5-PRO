server {
    listen 80;
    listen [::]:80;
    server_name pao.hihongrun.com;
    return 301 https://pao.hihongrun.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pao.hihongrun.com;

    ssl_certificate /etc/nginx/ssl/hihongrun-zerossl-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/hihongrun-zerossl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /data/prod/pao/current;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/pao.access.log;
    error_log /var/log/nginx/pao.error.log;

    location = /braintranning { return 301 /; }
    location ~ ^/braintranning/(.*)$ { return 301 /$1$is_args$args; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header X-Frame-Options SAMEORIGIN;
    }
}
